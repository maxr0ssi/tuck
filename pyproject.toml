[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuck-downloads"
version = "0.1.0"
description = "Private, review-first download filing for macOS."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
model = ["tinyjev[mlx]==0.1.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
tuck = "download_suggest.cli:main"
download-suggest = "download_suggest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
